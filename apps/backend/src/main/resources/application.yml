spring:
  application:
    name: liveKanban

  datasource:
    url: jdbc:postgresql://localhost:5432/kanban
    username: platform
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # если хочешь автоматически создать схему при первом запуске:
    # baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# Настройки для JWT и CORS/Origins под WS/REST
app:
  security:
    jwt:
      issuer: "live-kanban"
      secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32+_CHARS"
      access-token-ttl: 15m
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.web.socket: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always